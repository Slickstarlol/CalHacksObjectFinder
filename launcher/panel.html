<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecallAI Launcher</title>
<script>
  // Remembered light / dark choice (without one, follow the system).
  try { const t = localStorage.getItem("recallai.launcher.theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#eef7fb, #0a1822); --page: light-dark(#ddeef6, #0a1822);
  --grid-major: light-dark(rgb(255 255 255 / 95%), rgb(220 239 248 / 7%));
  --grid-minor: light-dark(rgb(255 255 255 / 65%), rgb(220 239 248 / 3.5%));
  --card: light-dark(#ffffff, #10222d); --fg: light-dark(#0b2a3c, #e3f0f6);
  --muted: light-dark(#4e6b7c, #8eaab8); --line: light-dark(#d6e8f0, #22404f);
  --accent: light-dark(#0277b6, #4cb2ea); --accent-fg: light-dark(#ffffff, #03263a);
  --warn: light-dark(#a3500a, #f3b66a); --bad: light-dark(#b23a25, #ff8f7b);
  --info: light-dark(#0b4f7a, #8fd0f5); --pill: light-dark(#eaf5fa, #12384b);
  --log-bg: light-dark(#0b2a3c, #071520); --log-fg: #c2d7e2; --off: light-dark(#56717f, #6f8d9c);
  --font: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Chakra Petch', 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --lens-bg: light-dark(#e8f4fa, #11303f); --lens-glow: light-dark(rgb(255 255 255 / 75%), rgb(255 255 255 / 12%));
  --dot-on: #00e676; --dot-bad: #ff2d2d;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  /* A dark rim keeps the bright dots visible on light pills. */
  --dot-rim: light-dark(rgb(0 0 0 / 35%), transparent);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
/* A denser grid centred on the cursor, like the dashboard (--mx/--my set by the script below). */
body { --mx: -999px; --my: -999px; position: relative; isolation: isolate; }
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; opacity: 0;
  transition: opacity 400ms var(--ease); pointer-events: none;
  -webkit-mask-image: radial-gradient(circle 100px at var(--mx) var(--my), #000 0, rgb(0 0 0 / 60%) 45%, transparent 100%);
  mask-image: radial-gradient(circle 100px at var(--mx) var(--my), #000 0, rgb(0 0 0 / 60%) 45%, transparent 100%); }
body::before { background-color: var(--lens-bg);
  background-image: repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 70%, transparent) 0 1px, transparent 1px 12.5px),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, transparent) 0 1px, transparent 1px 12.5px);
  background-position: calc(var(--mx) * -0.25) calc(var(--my) * -0.25); }
body::after { background: radial-gradient(circle 36px at var(--mx) var(--my), var(--lens-glow), transparent 100%); }
body.lens-on::before, body.lens-on::after { opacity: 1; }
@media (hover: none) { body::before, body::after { display: none; } }
body { margin: 0; min-height: 100vh; color: var(--fg); -webkit-font-smoothing: antialiased;
  font: 15px/1.45 var(--font);
  background-color: var(--page);
  background-image: repeating-linear-gradient(0deg, var(--grid-major) 0 1.5px, transparent 1.5px 40px),
    repeating-linear-gradient(90deg, var(--grid-major) 0 1.5px, transparent 1.5px 40px),
    repeating-linear-gradient(0deg, var(--grid-minor) 0 1px, transparent 1px 10px),
    repeating-linear-gradient(90deg, var(--grid-minor) 0 1px, transparent 1px 10px);
  background-attachment: fixed; }
main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 22px/1.2 var(--display); margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--fg); padding: 8px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
/* a Save button with nothing new to save reads "Saved" */
button.saved:disabled { opacity: 1; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-size: 14px; }
.banner.warn { border-color: var(--warn); }
ol { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; counter-reset: step; }
li.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; }
li.step.disabled .title, li.step.disabled .desc { color: var(--off); }
.num { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 16%, var(--card));
  display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--accent); }
li.step.disabled .num { background: var(--pill); color: var(--off); }
.title { font-family: var(--display); font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.desc { color: var(--muted); font-size: 13px; grid-column: 2; }
.right { grid-row: span 2; display: flex; align-items: center; gap: 10px; }
.meta { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-top: 4px; }
.msg { color: var(--muted); overflow-wrap: anywhere; }
.pill { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--pill);
  color: var(--muted); white-space: nowrap; }
.pill.ready, .pill.done, .pill.already-running { color: var(--accent); }
.pill.starting { color: var(--info); }
.pill.failed, .pill.exited { color: var(--bad); }
.pill.skipped, .pill.stopped { color: var(--warn); }
.pill.starting::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
  border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* green dot = running / done, red dot = failed / stopped */
.pill.ready::before, .pill.done::before, .pill.already-running::before,
.pill.failed::before, .pill.exited::before, .pill.stopped::before {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%;
  vertical-align: 0; background: var(--dot-on); box-shadow: 0 0 0 1px var(--dot-rim), 0 0 6px var(--dot-on); }
.pill.ready::before, .pill.already-running::before { animation: pulse 1.8s var(--ease) infinite; }
.pill.failed::before, .pill.exited::before, .pill.stopped::before { background: var(--dot-bad); box-shadow: 0 0 0 1px var(--dot-rim), 0 0 6px var(--dot-bad); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 1px var(--dot-rim), 0 0 6px var(--dot-on), 0 0 0 0 color-mix(in srgb, var(--dot-on) 70%, transparent); }
  70%, 100% { box-shadow: 0 0 0 1px var(--dot-rim), 0 0 6px var(--dot-on), 0 0 0 7px transparent; } }
/* switch */
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line);
  transition: background-color 280ms var(--ease), box-shadow 280ms var(--ease); }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 999px; background: #fff; box-shadow: 0 1px 3px #0003;
  transition: transform 420ms var(--spring), width 220ms var(--ease); }
.switch:hover span { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.switch input:active + span::after { width: 25px; }   /* the knob stretches while pressed */
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:checked:active + span::after { transform: translateX(13px); }
@media (prefers-reduced-motion: reduce) {
  .switch span, .switch span::after, .theme-btn, .theme-btn svg, .theme-btn svg * { transition: none; }
  .pill::before { animation: none !important; }
}
.switch input:focus-visible + span { outline: 2px solid var(--info); outline-offset: 2px; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.theme-btn { display: inline-grid; place-items: center; width: 38px; padding: 0;
  transition: border-color 160ms var(--ease), transform 300ms var(--spring); }
.theme-btn:active { transform: scale(0.92); }
.theme-btn svg { overflow: visible; transition: transform 420ms var(--spring); }
.theme-btn:hover svg { transform: rotate(-20deg) scale(1.08); }
/* The sun morphs into a moon, like the dashboard: the core grows, a bite slides in, the rays spin away. */
.theme-core { r: 5px; transition: r 500ms var(--spring); }
.theme-bite { cx: 27px; cy: -3px; transition: cx 500ms var(--ease), cy 500ms var(--ease); }
.theme-rays { transform-origin: 12px 12px; transition: transform 500ms var(--spring), opacity 250ms var(--ease); }
:root[data-theme="dark"] .theme-core { r: 8.5px; }
:root[data-theme="dark"] .theme-bite { cx: 17.5px; cy: 7.5px; }
:root[data-theme="dark"] .theme-rays { opacity: 0; transform: rotate(-90deg) scale(0.4); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-core { r: 8.5px; }
  :root:not([data-theme="light"]) .theme-bite { cx: 17.5px; cy: 7.5px; }
  :root:not([data-theme="light"]) .theme-rays { opacity: 0; transform: rotate(-90deg) scale(0.4); }
}
/* The new theme grows in a circle out of the toggle (View Transitions). */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-new(root) { animation: theme-flip 620ms var(--ease) both; }
@keyframes theme-flip {
  from { clip-path: circle(0 at var(--flip-x, 100%) var(--flip-y, 0)); }
  to { clip-path: circle(150vmax at var(--flip-x, 100%) var(--flip-y, 0)); } }
/* option dropdowns (e.g. which camera the Camera step uses) */
.opts { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
.opt { display: flex; gap: 8px; align-items: center; color: var(--muted); font-weight: 600; }
select { font: inherit; font-weight: 400; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 8px; min-width: 200px; cursor: pointer; }
select:hover:not(:disabled) { border-color: var(--muted); }
select:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.opt-note { color: var(--muted); }
.opt-note.bad { color: var(--bad); }
/* text boxes (e.g. the Grok API key, the Maincloud database) */
.opt.wide { flex: 1; min-width: min(100%, 280px); }
input.text { font: 13px/1.4 var(--mono); color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 8px; flex: 1; min-width: 0; }
input.text:hover { border-color: var(--muted); }
input.text:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
details { grid-column: 1 / 4; margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { background: var(--log-bg); color: var(--log-fg); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0;
  max-height: 260px; overflow: auto; font: 12px/1.45 var(--mono); white-space: pre-wrap;
  overflow-wrap: anywhere; }
code { font: 12px var(--mono); color: var(--muted); }
footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
/* Narrow windows: number + title on top, the text full width, then the
   buttons (switch on the right), then the log. */
@media (max-width: 560px) {
  li.step { grid-template-columns: auto 1fr; padding: 14px; }
  .num { grid-row: auto; }
  .desc, .meta, .opts, details { grid-column: 1 / -1; }
  .right { grid-row: auto; grid-column: 1 / -1; order: 1; margin-top: 6px; }
  .right .switch { margin-left: auto; }
  details { order: 2; }
  select { min-width: 0; flex: 1; }
  .toolbar { width: 100%; }
  .toolbar button:not(.theme-btn) { flex: 1 1 auto; }
}
/* Touch screens: bigger targets, and 16px text boxes so iPhones don't zoom in. */
@media (pointer: coarse) {
  input.text, select { font-size: 16px; }
  button.small { min-height: 40px; padding-inline: 14px; }
  summary { padding: 8px 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>RecallAI Launcher</h1>
      <p class="sub" id="sub">Turn on the steps you want, then Start all. They start top to bottom, each waiting for the one before.</p>
    </div>
    <div class="toolbar">
      <button class="primary" id="start">Start all</button>
      <button id="stop">Stop all</button>
      <button class="danger" id="quit" title="Stop everything and close the launcher">Quit launcher</button>
      <button class="theme-btn" id="theme" type="button" aria-label="Switch to dark mode" title="Dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <mask id="theme-mask"><rect width="24" height="24" fill="#fff"/><circle class="theme-bite" r="6.5" fill="#000"/></mask>
          <circle class="theme-core" cx="12" cy="12" fill="currentColor" mask="url(#theme-mask)"/>
          <g class="theme-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 1.8v2.2M12 20v2.2M1.8 12h2.2M20 12h2.2M4.8 4.8l1.5 1.5M17.7 17.7l1.5 1.5M4.8 19.2l1.5-1.5M17.7 6.3l1.5-1.5"/>
          </g>
        </svg>
      </button>
    </div>
  </header>
  <div id="banner"></div>
  <ol id="steps"></ol>
  <footer>Logs are also saved in <code>launcher/logs/</code>. Your on/off choices are remembered.</footer>
</main>
<script>
const $ = (s) => document.querySelector(s);
// Light / dark toggle (remembered in this browser; without a choice, follow the system).
(() => {
  const btn = $("#theme");
  const sys = window.matchMedia("(prefers-color-scheme: dark)");
  const current = () => document.documentElement.dataset.theme || (sys.matches ? "dark" : "light");
  const label = () => {
    const dark = current() === "dark";
    btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    btn.title = dark ? "Light mode" : "Dark mode";
  };
  btn.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    const apply = () => {
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("recallai.launcher.theme", next); } catch (e) {}
      label();
    };
    if (!document.startViewTransition || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return apply();
    // The new theme grows in a circle out of the button, like the dashboard.
    const r = btn.getBoundingClientRect(), root = document.documentElement.style;
    root.setProperty("--flip-x", r.left + r.width / 2 + "px");
    root.setProperty("--flip-y", r.top + r.height / 2 + "px");
    document.startViewTransition(apply);
  });
  sys.addEventListener?.("change", label);
  label();
})();
// Cursor lens on the page grid (see body::before / ::after): once per frame, no layout work.
(() => {
  let frame = 0, x = 0, y = 0;
  const paint = () => {
    frame = 0;
    document.body.style.setProperty("--mx", x + "px");
    document.body.style.setProperty("--my", y + "px");
    document.body.classList.add("lens-on");
  };
  window.addEventListener("mousemove", (e) => {
    x = e.clientX; y = e.clientY;
    if (!frame) frame = requestAnimationFrame(paint);
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => document.body.classList.remove("lens-on"));
})();
const LABEL = { off: "Off", waiting: "Waiting", starting: "Starting", ready: "Running", done: "Done",
  "already-running": "Already running", failed: "Failed", skipped: "Skipped", stopped: "Stopped", exited: "Stopped by itself" };
let state = null, openLogs = new Set(), logNext = {}, busy = false;
// Dropdown lists from the launcher (e.g. "cameras"): {status, choices, error}
const lists = {};

async function loadList(name) {
  if (lists[name] && lists[name].status === "loading") return;
  lists[name] = { ...(lists[name] || { choices: [] }), status: "loading", error: null };
  render();
  try {
    const r = await api(`/api/choices/${encodeURIComponent(name)}`);
    lists[name] = { status: r.error ? "error" : "ok", choices: r.choices || [], error: r.error };
  } catch (e) {
    lists[name] = { status: "error", choices: [], error: "The launcher didn't answer." };
  }
  render();
}

function fillOption(li, s, o) {
  const sel = li.querySelector(`select[data-opt="${CSS.escape(o.id)}"]`);
  const note = li.querySelector(`[data-opt-note="${CSS.escape(o.id)}"]`);
  const list = lists[o.choices] || { status: "loading", choices: [] };
  const choices = [...list.choices];
  if (o.value && !choices.some(c => c.value === o.value)) {
    choices.unshift({ value: o.value, label: list.status === "loading"
      ? `Camera ${o.value}` : `Camera ${o.value} (not found)` });
  }
  const sig = JSON.stringify(choices);
  if (sel.dataset.sig !== sig) {
    sel.replaceChildren(...choices.map(c => el("option", { value: c.value }, c.label)));
    sel.dataset.sig = sig;
  }
  if (document.activeElement !== sel) sel.value = o.value;
  const active = ["starting", "ready"].includes(s.status);
  note.className = "opt-note" + (list.status === "error" ? " bad" : "");
  note.textContent = list.status === "loading" ? "Looking for cameras…"
    : list.status === "error" ? list.error
    : active ? "Changing it restarts the camera." : "";
}

// Text boxes: Save (or Enter) sends the value; the button then reads "Saved".
// Errors and restart warnings are shown next to the box.
const saveNotes = {};

function textOption(s, o) {
  const key = `${s.id}/${o.id}`;
  const input = el("input", { class: "text", type: o.secret ? "password" : "text", "data-opt": o.id,
    "aria-label": `${o.label} for ${s.name}`, autocomplete: "off", spellcheck: "false" });
  const save = el("button", { class: "small", "data-opt-save": o.id, disabled: true }, "Save");
  const submit = async () => {
    if (save.disabled) return;
    save.disabled = true;
    try {
      // An empty box goes back to the default (a secret can't be empty: Save stays off).
      const r = await api("/api/option", { id: s.id, option: o.id, value: input.value.trim() });
      if (r.error) {
        saveNotes[key] = { text: r.error, bad: true };
      } else {
        state = r;
        if (o.secret) input.value = "";
        input.dataset.saved = input.value;   // no longer being edited: show what was saved
        const restart = o.dotenv && r.steps.some(x => x.kind !== "exit" && ["starting", "ready"].includes(x.status));
        if (restart) saveNotes[key] = { text: "Running steps keep the old value until restarted." };
        else delete saveNotes[key];
      }
    } catch (e) {
      saveNotes[key] = { text: "The launcher didn't answer.", bad: true };
    }
    render();
  };
  input.oninput = () => { delete saveNotes[key]; render(); };
  input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  save.onclick = submit;
  return el("div", { class: "opts" },
    el("label", { class: "opt wide" }, o.label, input), save, el("span", { "data-opt-note": o.id }));
}

function fillText(li, s, o) {
  const input = li.querySelector(`input[data-opt="${CSS.escape(o.id)}"]`);
  const save = li.querySelector(`[data-opt-save="${CSS.escape(o.id)}"]`);
  const note = li.querySelector(`[data-opt-note="${CSS.escape(o.id)}"]`);
  // Show the saved value unless you are editing it (a secret never comes back, only a hint).
  if (input.value === (input.dataset.saved ?? "")) input.value = o.value;
  input.dataset.saved = o.value;
  if (o.secret) input.placeholder = o.hint ? `${o.hint} · paste a new key to change it` : "Paste your key";
  const value = input.value.trim();
  save.disabled = (o.secret && !value) || value === o.value;
  // "Saved" when the box holds the saved value (for a secret: the box is empty and a key is set).
  const saved = o.secret ? !value && !!o.hint : value === o.value && value !== "";
  save.textContent = saved ? "✓ Saved" : "Save";
  save.classList.toggle("saved", saved);
  const done = saveNotes[`${s.id}/${o.id}`];
  note.className = "opt-note" + (done && done.bad ? " bad" : "");
  note.textContent = done ? done.text : o.dotenv ? `Kept in .env as ${o.dotenv} (not in git).` : "";
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v;
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function render() {
  if (!state) return;
  const running = state.running;
  const anyActive = state.steps.some(s => ["starting", "ready"].includes(s.status));
  $("#start").disabled = running || !state.steps.some(s => s.enabled);
  $("#start").textContent = running ? "Starting…" : "Start all";
  $("#stop").disabled = !running && !anyActive;

  const missing = Object.entries(state.tools).filter(([, ok]) => !ok).map(([k]) => k);
  const banner = $("#banner");
  banner.replaceChildren();
  if (missing.length) {
    banner.append(el("div", { class: "banner warn" },
      "Not found on this computer: ", el("b", {}, missing.join(", ")),
      ". Steps that need them will fail with install instructions."));
  }

  const ol = $("#steps");
  state.steps.forEach((s, i) => {
    let li = ol.querySelector(`[data-id="${CSS.escape(s.id)}"]`);
    if (!li) {
      li = el("li", { class: "step", "data-id": s.id });
      const toggle = el("input", { type: "checkbox", role: "switch", "aria-label": `Turn on ${s.name}` });
      toggle.onchange = async () => { state = await api("/api/toggle", { id: s.id, enabled: toggle.checked }); render(); };
      const startBtn = el("button", { class: "small", "data-act": "start" }, "Start");
      startBtn.onclick = () => api(`/api/step/${encodeURIComponent(s.id)}/start`, {}).then(poll);
      const stopBtn = el("button", { class: "small", "data-act": "stop" }, "Stop");
      stopBtn.onclick = () => api(`/api/step/${encodeURIComponent(s.id)}/stop`, {}).then(poll);
      const openBtn = el("button", { class: "small", "data-act": "open" }, "Open");
      openBtn.onclick = () => window.open(s.open_url, "_blank", "noopener");
      const opts = (s.options || []).map(o => {
        if (!o.choices) return textOption(s, o);
        const sel = el("select", { "data-opt": o.id, "aria-label": `${o.label} for ${s.name}` });
        sel.onchange = async () => {
          state = await api("/api/option", { id: s.id, option: o.id, value: sel.value });
          render();
        };
        const rescan = el("button", { class: "small", title: "Look for cameras again",
          "aria-label": "Look for cameras again" }, "↻");
        rescan.onclick = () => loadList(o.choices);
        if (o.choices && !lists[o.choices]) setTimeout(() => loadList(o.choices));  // after this render
        return el("div", { class: "opts" },
          el("label", { class: "opt" }, o.label, sel), rescan, el("span", { "data-opt-note": o.id }));
      });
      const details = el("details", {}, el("summary", {}, "Log"), el("pre", { "data-log": "" }));
      details.ontoggle = () => { details.open ? openLogs.add(s.id) : openLogs.delete(s.id); if (details.open) fetchLog(s.id); };
      li.append(
        el("div", { class: "num" }, String(i + 1)),
        el("div", { class: "title" }, el("span", { "data-name": "" }), el("span", { class: "pill", "data-pill": "" })),
        el("div", { class: "right" }, startBtn, stopBtn, openBtn, el("label", { class: "switch" }, toggle, el("span"))),
        el("div", { class: "desc" }, s.description),
        ...opts,
        el("div", { class: "meta" }, el("span", { class: "msg", "data-msg": "" })),
        details);
      ol.append(li);
    }
    li.classList.toggle("disabled", !s.enabled);
    li.querySelector("[data-name]").textContent = s.name;
    const pill = li.querySelector("[data-pill]");
    pill.className = "pill " + s.status;
    pill.textContent = LABEL[s.status] || s.status;
    const toggle = li.querySelector("input[type=checkbox]");
    if (document.activeElement !== toggle) toggle.checked = s.enabled;
    toggle.disabled = running;
    const active = ["starting", "ready"].includes(s.status);
    li.querySelector('[data-act="start"]').disabled = running || active;
    li.querySelector('[data-act="stop"]').disabled = !active;
    const open = li.querySelector('[data-act="open"]');
    open.hidden = !s.open_url;
    open.disabled = !["ready", "already-running"].includes(s.status);
    li.querySelector("[data-msg]").textContent = s.message || (s.enabled ? "" : "Off — this step will be skipped");
    (s.options || []).forEach(o => o.choices ? fillOption(li, s, o) : fillText(li, s, o));
  });
}

async function fetchLog(id) {
  const li = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  const pre = li && li.querySelector("[data-log]");
  if (!pre) return;
  const r = await api(`/api/logs/${encodeURIComponent(id)}?since=${logNext[id] || 0}`);
  if (r.lines && r.lines.length) {
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    pre.textContent += r.lines.join("\n") + "\n";
    if (pre.textContent.length > 60000) pre.textContent = pre.textContent.slice(-50000);
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  }
  logNext[id] = r.next;
}

async function poll() {
  if (busy) return;
  busy = true;
  try {
    state = await api("/api/state");
    render();
    await Promise.all([...openLogs].map(fetchLog));
    $("#sub").textContent = "Turn on the steps you want, then Start all. They start top to bottom, each waiting for the one before.";
  } catch (e) {
    $("#sub").textContent = "The launcher window was closed — start RecallAI.bat again.";
  } finally { busy = false; }
}

$("#start").onclick = async () => { await api("/api/start", {}); poll(); };
$("#stop").onclick = async () => { await api("/api/stop", {}); poll(); };
$("#quit").onclick = async () => {
  if (!confirmQuit()) return;
  await api("/api/quit", {});
  $("#sub").textContent = "Stopping everything… you can close this tab.";
};
function confirmQuit() { return window.__noConfirm || window.confirm("Stop every RecallAI process and close the launcher?"); }

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
