<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecallAI Launcher</title>
<style>
:root {
  --bg: #f5f4f0; --card: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e1db;
  --accent: #0b7a52; --accent-fg: #fff; --warn: #a15c00; --bad: #b3261e; --info: #2459b3;
  --pill: #ecebe6; --log-bg: #15171a; --log-fg: #d6d8dc; --off: #9a9a9f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121315; --card: #1b1d20; --fg: #ececee; --muted: #a0a0a8; --line: #2c2f33;
    --accent: #2fb380; --accent-fg: #06130d; --warn: #e3a64a; --bad: #ff8a80; --info: #8fb3ff;
    --pill: #26292d; --log-bg: #0b0c0e; --off: #6e6e75;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--fg); padding: 8px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-size: 14px; }
.banner.warn { border-color: var(--warn); }
ol { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; counter-reset: step; }
li.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; }
li.step.disabled .title, li.step.disabled .desc { color: var(--off); }
.num { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--pill);
  display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--muted); }
.title { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.desc { color: var(--muted); font-size: 13px; grid-column: 2; }
.right { grid-row: span 2; display: flex; align-items: center; gap: 10px; }
.meta { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-top: 4px; }
.msg { color: var(--muted); overflow-wrap: anywhere; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--pill);
  color: var(--muted); white-space: nowrap; }
.pill.ready, .pill.done, .pill.already-running { color: var(--accent); }
.pill.starting { color: var(--info); }
.pill.failed, .pill.exited { color: var(--bad); }
.pill.skipped, .pill.stopped { color: var(--warn); }
.pill.starting::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
  border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* switch */
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px #0003; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--info); outline-offset: 2px; }
/* option dropdowns (e.g. which camera the Camera step uses) */
.opts { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
.opt { display: flex; gap: 8px; align-items: center; color: var(--muted); font-weight: 600; }
select { font: inherit; font-weight: 400; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 8px; min-width: 200px; cursor: pointer; }
select:hover:not(:disabled) { border-color: var(--muted); }
select:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.opt-note { color: var(--muted); }
.opt-note.bad { color: var(--bad); }
details { grid-column: 1 / 4; margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { background: var(--log-bg); color: var(--log-fg); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0;
  max-height: 260px; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap;
  overflow-wrap: anywhere; }
code { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
@media (max-width: 560px) {
  li.step { grid-template-columns: auto 1fr; }
  .right { grid-row: auto; grid-column: 1 / 3; justify-content: flex-end; }
  .meta, .opts, details { grid-column: 1 / 3; }
  select { min-width: 0; flex: 1; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>RecallAI Launcher</h1>
      <p class="sub" id="sub">Turn on the steps you want, then Start all. They start top to bottom, each waiting for the one before.</p>
    </div>
    <div class="toolbar">
      <button class="primary" id="start">Start all</button>
      <button id="stop">Stop all</button>
      <button class="danger" id="quit" title="Stop everything and close the launcher">Quit launcher</button>
    </div>
  </header>
  <div id="banner"></div>
  <ol id="steps"></ol>
  <footer>Logs are also saved in <code>launcher/logs/</code>. Your on/off choices are remembered.</footer>
</main>
<script>
const $ = (s) => document.querySelector(s);
const LABEL = { off: "Off", waiting: "Waiting", starting: "Starting", ready: "Running", done: "Done",
  "already-running": "Already running", failed: "Failed", skipped: "Skipped", stopped: "Stopped", exited: "Stopped by itself" };
let state = null, openLogs = new Set(), logNext = {}, busy = false;
// Dropdown lists from the launcher (e.g. "cameras"): {status, choices, error}
const lists = {};

async function loadList(name) {
  if (lists[name] && lists[name].status === "loading") return;
  lists[name] = { ...(lists[name] || { choices: [] }), status: "loading", error: null };
  render();
  try {
    const r = await api(`/api/choices/${encodeURIComponent(name)}`);
    lists[name] = { status: r.error ? "error" : "ok", choices: r.choices || [], error: r.error };
  } catch (e) {
    lists[name] = { status: "error", choices: [], error: "The launcher didn't answer." };
  }
  render();
}

function fillOption(li, s, o) {
  const sel = li.querySelector(`select[data-opt="${CSS.escape(o.id)}"]`);
  const note = li.querySelector(`[data-opt-note="${CSS.escape(o.id)}"]`);
  const list = lists[o.choices] || { status: "loading", choices: [] };
  const choices = [...list.choices];
  if (o.value && !choices.some(c => c.value === o.value)) {
    choices.unshift({ value: o.value, label: list.status === "loading"
      ? `Camera ${o.value}` : `Camera ${o.value} (not found)` });
  }
  const sig = JSON.stringify(choices);
  if (sel.dataset.sig !== sig) {
    sel.replaceChildren(...choices.map(c => el("option", { value: c.value }, c.label)));
    sel.dataset.sig = sig;
  }
  if (document.activeElement !== sel) sel.value = o.value;
  const active = ["starting", "ready"].includes(s.status);
  note.className = "opt-note" + (list.status === "error" ? " bad" : "");
  note.textContent = list.status === "loading" ? "Looking for cameras…"
    : list.status === "error" ? list.error
    : active ? "Changing it restarts the camera." : "";
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v;
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function render() {
  if (!state) return;
  const running = state.running;
  const anyActive = state.steps.some(s => ["starting", "ready"].includes(s.status));
  $("#start").disabled = running || !state.steps.some(s => s.enabled);
  $("#start").textContent = running ? "Starting…" : "Start all";
  $("#stop").disabled = !running && !anyActive;

  const missing = Object.entries(state.tools).filter(([, ok]) => !ok).map(([k]) => k);
  const banner = $("#banner");
  banner.replaceChildren();
  if (missing.length) {
    banner.append(el("div", { class: "banner warn" },
      "Not found on this computer: ", el("b", {}, missing.join(", ")),
      ". Steps that need them will fail with install instructions."));
  }

  const ol = $("#steps");
  state.steps.forEach((s, i) => {
    let li = ol.querySelector(`[data-id="${CSS.escape(s.id)}"]`);
    if (!li) {
      li = el("li", { class: "step", "data-id": s.id });
      const toggle = el("input", { type: "checkbox", role: "switch", "aria-label": `Turn on ${s.name}` });
      toggle.onchange = async () => { state = await api("/api/toggle", { id: s.id, enabled: toggle.checked }); render(); };
      const startBtn = el("button", { class: "small", "data-act": "start" }, "Start");
      startBtn.onclick = () => api(`/api/step/${encodeURIComponent(s.id)}/start`, {}).then(poll);
      const stopBtn = el("button", { class: "small", "data-act": "stop" }, "Stop");
      stopBtn.onclick = () => api(`/api/step/${encodeURIComponent(s.id)}/stop`, {}).then(poll);
      const openBtn = el("button", { class: "small", "data-act": "open" }, "Open");
      openBtn.onclick = () => window.open(s.open_url, "_blank", "noopener");
      const opts = (s.options || []).map(o => {
        const sel = el("select", { "data-opt": o.id, "aria-label": `${o.label} for ${s.name}` });
        sel.onchange = async () => {
          state = await api("/api/option", { id: s.id, option: o.id, value: sel.value });
          render();
        };
        const rescan = el("button", { class: "small", title: "Look for cameras again",
          "aria-label": "Look for cameras again" }, "↻");
        rescan.onclick = () => loadList(o.choices);
        if (o.choices && !lists[o.choices]) setTimeout(() => loadList(o.choices));  // after this render
        return el("div", { class: "opts" },
          el("label", { class: "opt" }, o.label, sel), rescan, el("span", { "data-opt-note": o.id }));
      });
      const details = el("details", {}, el("summary", {}, "Log"), el("pre", { "data-log": "" }));
      details.ontoggle = () => { details.open ? openLogs.add(s.id) : openLogs.delete(s.id); if (details.open) fetchLog(s.id); };
      li.append(
        el("div", { class: "num" }, String(i + 1)),
        el("div", { class: "title" }, el("span", { "data-name": "" }), el("span", { class: "pill", "data-pill": "" })),
        el("div", { class: "right" }, startBtn, stopBtn, openBtn, el("label", { class: "switch" }, toggle, el("span"))),
        el("div", { class: "desc" }, s.description),
        ...opts,
        el("div", { class: "meta" }, el("span", { class: "msg", "data-msg": "" })),
        details);
      ol.append(li);
    }
    li.classList.toggle("disabled", !s.enabled);
    li.querySelector("[data-name]").textContent = s.name;
    const pill = li.querySelector("[data-pill]");
    pill.className = "pill " + s.status;
    pill.textContent = LABEL[s.status] || s.status;
    const toggle = li.querySelector("input[type=checkbox]");
    if (document.activeElement !== toggle) toggle.checked = s.enabled;
    toggle.disabled = running;
    const active = ["starting", "ready"].includes(s.status);
    li.querySelector('[data-act="start"]').disabled = running || active;
    li.querySelector('[data-act="stop"]').disabled = !active;
    const open = li.querySelector('[data-act="open"]');
    open.hidden = !s.open_url;
    open.disabled = !["ready", "already-running"].includes(s.status);
    li.querySelector("[data-msg]").textContent = s.message || (s.enabled ? "" : "Off — this step will be skipped");
    (s.options || []).forEach(o => fillOption(li, s, o));
  });
}

async function fetchLog(id) {
  const li = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  const pre = li && li.querySelector("[data-log]");
  if (!pre) return;
  const r = await api(`/api/logs/${encodeURIComponent(id)}?since=${logNext[id] || 0}`);
  if (r.lines && r.lines.length) {
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    pre.textContent += r.lines.join("\n") + "\n";
    if (pre.textContent.length > 60000) pre.textContent = pre.textContent.slice(-50000);
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  }
  logNext[id] = r.next;
}

async function poll() {
  if (busy) return;
  busy = true;
  try {
    state = await api("/api/state");
    render();
    await Promise.all([...openLogs].map(fetchLog));
    $("#sub").textContent = "Turn on the steps you want, then Start all. They start top to bottom, each waiting for the one before.";
  } catch (e) {
    $("#sub").textContent = "The launcher window was closed — start RecallAI.bat again.";
  } finally { busy = false; }
}

$("#start").onclick = async () => { await api("/api/start", {}); poll(); };
$("#stop").onclick = async () => { await api("/api/stop", {}); poll(); };
$("#quit").onclick = async () => {
  if (!confirmQuit()) return;
  await api("/api/quit", {});
  $("#sub").textContent = "Stopping everything… you can close this tab.";
};
function confirmQuit() { return window.__noConfirm || window.confirm("Stop every RecallAI process and close the launcher?"); }

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
