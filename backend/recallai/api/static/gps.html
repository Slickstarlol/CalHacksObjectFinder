
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>RecallAI GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
    color-scheme: light dark;
    --page: light-dark(#ddeef6, #0a1822);
    --grid-major: light-dark(rgb(255 255 255 / 95%), rgb(220 239 248 / 7%));
    --grid-minor: light-dark(rgb(255 255 255 / 65%), rgb(220 239 248 / 3.5%));
    --surface: light-dark(#ffffff, #10222d);
    --text: light-dark(#0b2a3c, #e3f0f6);
    --muted: light-dark(#4e6b7c, #8eaab8);
    --border: light-dark(#d6e8f0, #22404f);
    --border-hover: light-dark(#9cc8dc, #4a7a92);
    --accent: light-dark(#0277b6, #4cb2ea);
    --font: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --display: 'Chakra Petch', 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
body {
    margin: 0;
    min-height: 100vh;
    padding: 30px;
    text-align: center;
    color: var(--text);
    font: 15px/1.45 var(--font);
    -webkit-font-smoothing: antialiased;
    background-color: var(--page);
    background-image: repeating-linear-gradient(0deg, var(--grid-major) 0 1.5px, transparent 1.5px 40px),
        repeating-linear-gradient(90deg, var(--grid-major) 0 1.5px, transparent 1.5px 40px),
        repeating-linear-gradient(0deg, var(--grid-minor) 0 1px, transparent 1px 10px),
        repeating-linear-gradient(90deg, var(--grid-minor) 0 1px, transparent 1px 10px);
    background-attachment: fixed;
}
h1, h3 { font-family: var(--display); margin: 0 0 8px; }
h3 { font-weight: 500; color: var(--muted); }
a { color: var(--accent); }
nav { font-family: var(--mono); font-size: 13px; }
button {
    font: inherit;
    padding: 10px 20px;
    margin: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
}
button:hover { border-color: var(--border-hover); }
#status { font-family: var(--mono); font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<nav style="margin-bottom:20px">GPS · <a href="/search">Search</a></nav>

<h1>RecallAI</h1>
<h3>Phone Location Connection</h3>

<button onclick="startGPS()">Enable GPS</button>
<button onclick="stopGPS()">Stop GPS</button>

<p id="status" role="status">GPS disconnected</p>

<div id="alerts" style="max-width:480px;margin:20px auto;text-align:left"></div>

<script src="/auth.js"></script>
<script>
// Your phone's location is stored for YOUR account only: the camera
// attaches it to sightings of your belongings, and the watcher uses it
// to notice when you walk away from them.
let watchID = null;

function startGPS() {
    if (!navigator.geolocation) {
        document.getElementById("status").textContent =
            "Geolocation is unavailable";
        return;
    }

    if (watchID !== null) return;

    watchID = navigator.geolocation.watchPosition(
        async position => {
            const gps = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };

            try {
                const response = await RecallAuth.fetch("/gps", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(gps)
                });

                if (!response.ok) {
                    throw new Error("Server rejected GPS");
                }

                document.getElementById("status").textContent =
                    "GPS Connected! Accuracy: ±" +
                    Math.round(gps.accuracy) + " meters";

            } catch (error) {
                document.getElementById("status").textContent =
                    "Could not send GPS to laptop";
            }
        },
        error => {
            document.getElementById("status").textContent =
                error.message;

            if (watchID !== null) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
            }
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 15000
        }
    );
}

// Proactive "did you forget it?" alerts from RecallAI
const shown = new Set();
async function pollAlerts() {
    try {
        const r = await RecallAuth.fetch("/api/alerts");
        if (!r.ok) return;
        const alerts = await r.json();
        const box = document.getElementById("alerts");
        box.innerHTML = "";
        for (const a of alerts) {
            const div = document.createElement("div");
            div.style.cssText = "padding:12px;margin:8px 0;border-radius:10px;" +
                (a.urgency === "high" ? "background:light-dark(#fff1ec,#3a1b15);color:light-dark(#b23a25,#ff8f7b)" : "background:light-dark(#fbf4e6,#33270f);color:light-dark(#a3500a,#f3b66a)");
            div.textContent = a.message;
            box.appendChild(div);
            if (!shown.has(a.id)) {
                shown.add(a.id);
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
        }
    } catch (e) { /* laptop offline */ }
}
RecallAuth.require(() => {
    startGPS();   // ask for location as soon as the page is open and signed in
    pollAlerts();
    setInterval(pollAlerts, 20000);
});

function stopGPS() {
    if (watchID !== null) {
        navigator.geolocation.clearWatch(watchID);
        watchID = null;
    }

    document.getElementById("status").textContent =
        "GPS stopped";
}
</script>

</body>
</html>
